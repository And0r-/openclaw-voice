x-logging:
  &loki-logging
  driver: loki
  options:
    loki-url: "http://10.100.126.2:3100/loki/api/v1/push"
    loki-batch-size: "400"
    loki-retries: "2"
    loki-timeout: "1s"
    loki-max-backoff: "800ms"
    keep-file: "true"
    max-size: "50m"
    max-file: "3"

services:
  openclaw-voice:
    build:
      dockerfile: Dockerfile.prod
    ports:
      - "${OPENCLAW_HOST:-0.0.0.0}:${OPENCLAW_PORT:-8765}:8765"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *loki-logging
